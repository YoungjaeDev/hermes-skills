name: Validate skills

on:
  push:
  pull_request:

jobs:
  structure:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check skill structure and referenced files
        run: python tests/test_skills.py
